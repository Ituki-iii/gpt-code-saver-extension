<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Code Saver Options</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 560px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 20px;
        line-height: 1.25;
      }
      section {
        border-top: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        padding-top: 16px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        min-height: 32px;
        padding: 0 12px;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, CanvasText 24%, transparent);
        background: ButtonFace;
        color: ButtonText;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        min-height: 20px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ChatGPT Code Saver Options</h1>
      <section>
        <h2>Bulk Chats Debug</h2>
        <div class="row">
          <button id="api-debug" type="button">API Debug</button>
          <button id="move-debug" type="button">Move Debug</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
